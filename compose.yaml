services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: little_worlds
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - village_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d little_worlds"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  village_pg:
